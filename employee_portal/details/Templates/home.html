<!DOCTYPE html>
<html>
<head>
    <title>{% block title %}Employee Portal{% endblock %}</title>

    <style>
        .heading {
            font-size: 2em;
            font-weight: bold;
        }

        nav {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0.5em;
        }

        .links {
            display: flex;
            gap: 30px;
        }

        .emp,
        .about {
            color: black;
            text-decoration: none;
        }

        .emp:hover,
        .about:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

    <nav>
        <div class="heading">
            <a href="http://127.0.0.1:8000/">
                Welcome to Employee Portal
            </a>
        </div>

        <div class="links">
            <a href="http://127.0.0.1:8000/employees/" class="emp">
                Employee List
            </a>

            <a href="http://127.0.0.1:8000/about/" class="about">
                About
            </a>
        </div>
    </nav>

    <hr>

    {% block content %}
    {% endblock %}

</body>
</html>
